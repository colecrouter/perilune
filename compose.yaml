services:
  perilune:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      PERILUNE_ORIGIN: ${PERILUNE_ORIGIN:-http://localhost:3000}
      PERILUNE_AUTH_SECRET: ${PERILUNE_AUTH_SECRET:-}
      PERILUNE_MOONRAKER_URL: ${PERILUNE_MOONRAKER_URL:-}
      PERILUNE_LIVE_CONFIGURATION: ${PERILUNE_LIVE_CONFIGURATION:-false}
      PERILUNE_LIVE_CONTROLS: ${PERILUNE_LIVE_CONTROLS:-false}
      PERILUNE_LIVE_Z_CALIBRATION: ${PERILUNE_LIVE_Z_CALIBRATION:-false}
      PERILUNE_LIVE_FILAMENT: ${PERILUNE_LIVE_FILAMENT:-false}
      PERILUNE_LIVE_MESH: ${PERILUNE_LIVE_MESH:-false}
      PERILUNE_MOONRAKER_API_KEY: ${PERILUNE_MOONRAKER_API_KEY:-}
      PERILUNE_CAMERA_BASE_URL: ${PERILUNE_CAMERA_BASE_URL:-}
      PERILUNE_CAMERA_SOURCE: ${PERILUNE_CAMERA_SOURCE:-}
    volumes:
      - perilune-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  perilune-data:
