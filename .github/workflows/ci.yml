name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run validate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:compose
      - run: docker build -t perilune:ci .
      - run: docker run --detach --name perilune-ci --publish 127.0.0.1:3000:3000 --env PERILUNE_ORIGIN=http://127.0.0.1:3000 perilune:ci
      - run: pnpm run test:smoke
        env:
          PERILUNE_SMOKE_URL: http://127.0.0.1:3000
      - run: docker logs perilune-ci
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-browser-evidence
          path: test-results/
          if-no-files-found: ignore
