name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run validate:checks

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: build/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [platform, calibration, workspaces, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: production-build
          path: build/
      - run: node scripts/smoke-suite.mjs "${{ matrix.group }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:compose
      - name: Verify shared camera conversion and idle shutdown
        run: node scripts/probe-camera-companion.mjs
      - run: docker build -t perilune:ci .
      - run: docker run --detach --name perilune-ci --publish 127.0.0.1:3000:3000 --env PERILUNE_ORIGIN=http://127.0.0.1:3000 perilune:ci
      - run: pnpm run test:smoke
        env:
          PERILUNE_SMOKE_URL: http://127.0.0.1:3000
      - run: docker logs perilune-ci
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-browser-evidence
          path: test-results/
          if-no-files-found: ignore

  camera:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: production-build
          path: build/
      - run: node scripts/smoke-camera-setup.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: camera-setup-evidence
          path: test-results/
          if-no-files-found: ignore

  # Stable required check: never green when a dependency fails or is skipped.
  validate:
    if: always()
    needs: [checks, build, smoke, container, camera]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation group
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
          CONTAINER: ${{ needs.container.result }}
          CAMERA: ${{ needs.camera.result }}
        run: |
          test "$CHECKS" = success
          test "$BUILD" = success
          test "$SMOKE" = success
          test "$CONTAINER" = success
          test "$CAMERA" = success
