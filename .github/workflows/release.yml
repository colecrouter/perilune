name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require a matching version on main
        id: identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release/version.mjs "$TAG" > "$RUNNER_TEMP/version.json"
          node --input-type=module -e 'import fs from "node:fs";const v=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/version.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"version="+v.version+"\nprerelease="+v.prerelease+"\n");'
  validation:
    needs: identity
    uses: ./.github/workflows/ci.yml
  images:
    needs: validation
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      publish: true
  publish:
    needs: [identity, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true
      - name: Publish immutable version manifest and install bundle
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.identity.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.identity.outputs.prerelease }}
        run: node scripts/release/publish.mjs
