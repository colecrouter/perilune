		let serial = 0;
		function phase(p, size) {
			const id = 'phase' + serial++;
			const k = 1 - 2 * p;
			const points = [];
			for (let i = 0; i <= 160; i++) {
				const y = -1 + (2 * i) / 160;
				points.push([50 + 48 * k * Math.sqrt(Math.max(0, 1 - y * y)), 50 + 48 * y]);
			}
			const path =
				'M50 2 A48 48 0 0 1 50 98 L' +
				points
					.reverse()
					.map((q) => q.join(' '))
					.join(' L') +
				' Z';
			return (
				'<svg width="' +
				size +
				'" height="' +
				size +
				'" viewBox="0 0 100 100" role="img" aria-label="' +
				Math.round(p * 100) +
				' percent illuminated"><defs><clipPath id="' +
				id +
				'"><path d="' +
				path +
				'"/></clipPath></defs><circle cx="50" cy="50" r="48" fill="#2d3850" stroke="#69738a" stroke-width="0.6"/><image href="' +
				image +
				'" width="100" height="100" clip-path="url(#' +
				id +
				')"/></svg>'
			);
		}
		document.querySelector('#phases').innerHTML = [0, 0.1, 0.25, 0.5, 0.75, 1]
			.map((p) => '<div class="phase">' + phase(p, 110) + Math.round(p * 100) + '%</div>')

		function update() {
			const p = Number(document.querySelector('#progress').value) / 100;
			document.querySelector('#value').textContent = Math.round(p * 100) + '%';
			document.querySelector('#sizes').innerHTML = [16, 32, 64, 160]
				.map((s) => phase(p, s))
				.join('');
		}
		document.querySelector('#progress').addEventListener('input', update);
		update();
	</script>
